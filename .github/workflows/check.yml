name: Check
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: "1.7.0"
          cache: true
          run-install: false
      - name: Verify declared Node.js runtime
        run: node -e 'const expected = require("./package.json").devEngines.runtime.version; if (process.versions.node !== expected) throw new Error(`Expected Node ${expected}, got ${process.version}`)'

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: git diff --exit-code
