allowBuilds:
  esbuild: true
  workerd: true
  sharp: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vitest: 5.1.0
  vite-plus: 1.7.0
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vitest
  allowedVersions:
    vitest: "*"

# Vite+ selects Node from package.json; do not let pnpm override CI matrices.
runtimeOnFail: ignore
